[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boop-cli"
dynamic = ["version"]
description = "Say what you want in plain English, get the shell command. Local model or any LLM provider."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thebunnyweb" }]
requires-python = ">=3.10"
keywords = ["shell", "cli", "terminal", "llm", "natural-language", "command-line", "bash", "zsh", "powershell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
# The base install is pure Python and installs anywhere (no compiler): the panel, every provider, TLS/proxies.
dependencies = [
    "prompt_toolkit>=3.0.36",
    "certifi",
    "tomli>=2; python_version < '3.11'",          # the config file (3.11+ has tomllib)
    "truststore>=0.9",                            # trust the OS certificate store (corporate CAs)
]

[project.optional-dependencies]
# boop's own model on your machine (llama.cpp builds from source where there's no wheel: Xcode CLT on macOS)
local = ["llama-cpp-python>=0.3.0", "huggingface_hub>=0.23"]
anthropic = ["anthropic>=1.0"]
all = ["boop-cli[local,anthropic]"]
dev = ["pytest>=7", "huggingface_hub>=0.23"]

[project.urls]
Homepage = "https://github.com/thebunnyweb/boop"
Repository = "https://github.com/thebunnyweb/boop"
Issues = "https://github.com/thebunnyweb/boop/issues"
Model = "https://huggingface.co/bunnyweb/boop-360m-gguf"

[project.scripts]
boop = "boop.cli:entry"

[tool.setuptools.dynamic]
version = { attr = "boop.__version__" }

[tool.setuptools.packages.find]
include = ["boop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
