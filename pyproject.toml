[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boop-cli"
version = "0.1.0"
description = "boop — nudge your shell. Say what you want in plain English, get the command."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "llama-cpp-python>=0.3.0",
    "huggingface_hub>=0.23",
    "prompt_toolkit>=3.0.36",
    "tomli>=2; python_version < '3.11'",          # the config file (3.11+ has tomllib)
    "truststore>=0.9; python_version >= '3.10'",  # trust the OS certificate store (corporate CAs)
    "certifi",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
boop = "boop.cli:entry"

[tool.setuptools.packages.find]
include = ["boop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
