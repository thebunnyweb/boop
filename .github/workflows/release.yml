# Publishes to PyPI with trusted publishing: no API token is stored anywhere.
# One-time setup on pypi.org → your account → Publishing → "Add a new pending publisher":
#   PyPI project: boop-cli · Owner: thebunnyweb · Repository: boop · Workflow: release.yml · Environment: pypi
# (and the same on test.pypi.org with Environment: testpypi). Then:
#   - Actions → release → Run workflow       → publishes to TestPyPI (try: pipx install --index-url https://test.pypi.org/simple/ --pip-args="--extra-index-url https://pypi.org/simple/" boop-cli)
#   - git tag v0.1.0 && git push origin v0.1.0 → publishes to PyPI
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,anthropic]" build twine
      - run: python -m pytest -q
      - name: the tag must match boop.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import boop; print(boop.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != boop.__version__ $v"; exit 1; }
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
